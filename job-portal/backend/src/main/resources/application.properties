spring.application.name=job-portal-backend

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=\#fucker\#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=4000

# ---- JWT ----
# 256-bit secret used to sign tokens - change this in production
jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123!
jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origin=http://localhost:5173

# ---- File uploads (resumes) ----
app.upload.dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
